<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block titulo %}SAMR{% endblock %} — Sistema de Atención Médica Remota</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      navy: '#0F2A4A', teal: '#14B8A6'
    } } } }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header class="bg-navy text-white px-6 py-4 flex items-center justify-between">
    <a href="{% url 'portal:login' %}" class="font-bold text-lg tracking-tight">SAMR</a>
    <span class="text-xs text-slate-300">Sistema de Atención Médica Remota — Equipo LLdE</span>
  </header>

  <main class="flex-1 flex justify-center px-4 py-10">
    <div class="w-full">
      {% if messages %}
        <div class="mb-4 space-y-2 max-w-2xl mx-auto">
          {% for message in messages %}
            <div class="rounded-lg px-4 py-3 text-sm
              {% if message.tags == 'error' %} bg-red-50 text-red-700 border border-red-200
              {% elif message.tags == 'success' %} bg-teal-50 text-teal-700 border border-teal-200
              {% else %} bg-blue-50 text-blue-700 border border-blue-200 {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <div class="flex justify-center">
        {% block contenido %}{% endblock %}
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    SAMR — Equipo LLdE — UTPL
  </footer>
</body>
</html>

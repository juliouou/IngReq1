{% extends "base.html" %}

{% block title %}Iniciar Sesión - SAMR{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-slate-50">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">
      Bienvenido a SAMR
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Por favor, inicia sesión en tu cuenta
    </p>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm bg-white p-8 rounded-lg shadow-sm border border-slate-200">
    <!-- Tabs (Visuales por ahora) -->
    <div class="flex mb-6 border-b border-gray-200">
        <a href="{% url 'login_ui' %}" class="w-1/2 py-2 text-center font-medium text-primary border-b-2 border-primary">Iniciar Sesión</a>
        <a href="{% url 'register_ui' %}" class="w-1/2 py-2 text-center font-medium text-gray-500 hover:text-gray-700">Registrarse</a>
    </div>

    <form class="space-y-6" action="#" method="POST">
      {% csrf_token %}
      <div>
        <label for="email" class="block text-sm font-medium leading-6 text-gray-900">Correo Electrónico</label>
        <div class="mt-2">
          <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm font-medium leading-6 text-gray-900">Contraseña</label>
        </div>
        <div class="mt-2">
          <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 px-3">
        </div>
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-primary px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
          Ingresar
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

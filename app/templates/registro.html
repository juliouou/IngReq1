<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>SAMR - Registro</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <!-- TODO Paula/David: esto es solo un esqueleto funcional para probar
       el endpoint POST /api/m1/registro. Reemplazar por el diseño real
       (wireframes ya definidos en Jira KAN-10). -->
  <main class="tarjeta">
    <h1>SAMR — Registro de Usuario</h1>
    <form id="form-registro">
      <label>Cédula <input name="cedula" maxlength="10" required /></label>
      <label>Afiliación IESS <input name="afiliacionIESS" required /></label>
      <label>Correo <input name="correo" type="email" required /></label>
      <label>Contraseña <input name="password" type="password" required /></label>
      <button type="submit">Registrarme</button>
    </form>
    <p id="mensaje"></p>
  </main>

  <script>
    document.getElementById("form-registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      const resp = await fetch("/api/m1/registro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos),
      });
      const json = await resp.json();
      document.getElementById("mensaje").textContent = resp.ok
        ? `Código MFA enviado. (demo: ${json.codigoMFA_debug})`
        : `Error: ${json.error}`;
    });
  </script>
</body>
</html>

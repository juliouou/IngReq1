openapi: 3.0.0
info:
  title: M2 - Triaje Inteligente
  version: 1.0.0
paths:
  /triage:
    post:
      summary: Registrar solicitud de triaje
      responses:
        '200':
          description: Triaje creado
  /matching:
    post:
      summary: Matching inteligente con centro de asistencia
      responses:
        '200':
          description: Matching resuelto
  /triage/{id}:
    get:
      summary: Consultar estado de un triaje
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estado del triaje
